<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#667eea">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>动作库 · 1324 个健身动作</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>💪</text></svg>">
<style>
  :root {
    --bg: #f0f4f8;
    --card-bg: #ffffff;
    --text: #1a202c;
    --text-secondary: #718096;
    --purple: #667eea;
    --purple-dark: #5a67d8;
    --purple-light: #ede9fe;
    --green: #38a169;
    --green-light: #e8f5e9;
    --orange: #f59e0b;
    --orange-light: #fff8e1;
    --radius: 16px;
    --shadow: 0 2px 12px rgba(0,0,0,0.07);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-size: 16px; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "SF Pro Display", "Helvetica Neue", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh; min-height: 100dvh;
    line-height: 1.6;
    padding-bottom: env(safe-area-inset-bottom, 24px);
  }
  .header {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: white;
    padding: 20px 20px 16px;
    padding-top: calc(20px + env(safe-area-inset-top, 0px));
    text-align: center;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 4px 20px rgba(102,126,234,0.3);
  }
  .header h1 { font-size: 1.25rem; font-weight: 800; letter-spacing: 0.5px; margin-bottom: 2px; }
  .header .sub { font-size: 0.78rem; opacity: 0.85; }
  .header .back-link {
    position: absolute; left: 16px; top: calc(16px + env(safe-area-inset-top, 0px));
    color: white; text-decoration: none; font-size: 0.85rem; opacity: 0.9;
    display: flex; align-items: center; gap: 4px;
  }

  /* Search & Filters */
  .search-bar {
    margin: 12px 16px 0;
    display: flex;
    gap: 8px;
  }
  .search-bar input {
    flex: 1;
    padding: 10px 14px;
    border: 1.5px solid #e2e8f0;
    border-radius: 12px;
    font-size: 0.9rem;
    outline: none;
    background: white;
    transition: border-color 0.2s;
  }
  .search-bar input:focus { border-color: var(--purple); }
  .search-bar input::placeholder { color: #a0aec0; }

  .filter-row {
    display: flex;
    gap: 8px;
    margin: 10px 16px 0;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    padding-bottom: 4px;
  }
  .filter-row::-webkit-scrollbar { display: none; }
  .filter-chip {
    flex: 0 0 auto;
    padding: 6px 14px;
    border-radius: 18px;
    border: 1.5px solid #e2e8f0;
    background: white;
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--text-secondary);
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
  }
  .filter-chip.active { background: var(--purple); color: white; border-color: var(--purple); }
  .filter-chip:hover { transform: translateY(-1px); }

  /* Count */
  .count-bar {
    margin: 12px 16px 8px;
    font-size: 0.78rem;
    color: var(--text-secondary);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  /* Exercise List */
  .container { max-width: 600px; margin: 0 auto; padding: 0 16px 16px; }
  .ex-item {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 10px;
    box-shadow: var(--shadow);
    cursor: pointer;
    transition: all 0.2s;
    animation: fadeUp 0.3s ease both;
  }
  .ex-item:active { transform: scale(0.98); }
  .ex-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 8px;
  }
  .ex-name { font-weight: 700; font-size: 0.95rem; color: var(--text); }
  .ex-name-en { font-size: 0.75rem; color: var(--text-secondary); font-weight: 400; margin-top: 1px; }
  .ex-thumb {
    width: 48px; height: 48px; border-radius: 10px; object-fit: cover;
    background: #f3f4f6; flex-shrink: 0; cursor: pointer;
  }
  .ex-header-left { display: flex; gap: 12px; align-items: flex-start; flex: 1; }
  .ex-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-top: 6px;
  }
  .ex-tag {
    font-size: 0.68rem;
    padding: 2px 8px;
    border-radius: 8px;
    font-weight: 600;
  }
  .tag-bodypart { background: var(--purple-light); color: var(--purple-dark); }
  .tag-category { background: #e0f2fe; color: #0369a1; }
  .tag-equipment { background: #f3f4f6; color: #6b7280; }
  .tag-plan { background: var(--green-light); color: #2e7d32; }

  /* Detail Panel */
  .detail-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 16px;
    animation: fadeIn 0.2s ease;
  }
  .detail-overlay.show { display: flex; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .detail-card {
    background: white;
    border-radius: var(--radius);
    max-width: 520px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
    animation: slideUp 0.25s ease;
  }
  .detail-header {
    position: sticky;
    top: 0;
    background: white;
    padding: 20px 20px 12px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    z-index: 1;
  }
  .detail-title { font-weight: 800; font-size: 1.1rem; }
  .detail-close {
    width: 32px; height: 32px;
    border: none;
    background: var(--gray-light, #f3f4f6);
    border-radius: 50%;
    font-size: 1.2rem;
    cursor: pointer;
    color: #6b7280;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
  }
  .detail-body { padding: 0 20px 20px; }
  .detail-info {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 16px;
  }
  .detail-info-item {
    flex: 1;
    min-width: 80px;
    text-align: center;
    padding: 10px 8px;
    border-radius: 10px;
    background: #f9fafb;
    font-size: 0.78rem;
  }
  .detail-info-label { color: #9ca3af; font-weight: 500; }
  .detail-info-value { font-weight: 700; color: var(--text); display: block; margin-top: 2px; }
  .detail-media {
    width: 100%; border-radius: 10px; margin-bottom: 14px;
    background: #f3f4f6; display: block; max-height: 260px;
    object-fit: contain; cursor: pointer;
  }
  .detail-section-title {
    font-weight: 700;
    font-size: 0.9rem;
    margin-bottom: 8px;
    color: var(--text);
  }
  .detail-instruction {
    font-size: 0.85rem;
    color: #4a5568;
    line-height: 1.7;
    padding: 12px 14px;
    background: #f9fafb;
    border-radius: 10px;
    white-space: pre-line;
  }
  .detail-plan-link {
    display: block;
    margin-top: 12px;
    text-align: center;
    padding: 10px;
    background: var(--green-light);
    color: #2e7d32;
    border-radius: 10px;
    font-weight: 700;
    font-size: 0.82rem;
    text-decoration: none;
  }
  .detail-not-in-plan {
    display: block;
    margin-top: 12px;
    text-align: center;
    font-size: 0.78rem;
    color: #9ca3af;
  }

  .footer {
    text-align: center;
    padding: 20px 16px 32px;
    color: #a0aec0;
    font-size: 0.75rem;
  }
  .footer a { color: var(--purple); text-decoration: none; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .loading {
    text-align: center;
    padding: 60px 16px;
    color: #a0aec0;
    font-size: 0.9rem;
  }
  .loading .spinner {
    display: inline-block;
    width: 28px; height: 28px;
    border: 3px solid #e2e8f0;
    border-top: 3px solid var(--purple);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .empty-state {
    text-align: center;
    padding: 40px 16px;
    color: #a0aec0;
    font-size: 0.9rem;
  }
</style>
</head>
<body>

<div class="header">
  <a class="back-link" href="index.html">← 返回计划</a>
  <h1>💪 动作库</h1>
  <div class="sub" id="hdr-sub">加载中...</div>
</div>

<div class="search-bar">
  <input type="text" id="search-input" placeholder="🔍 搜索动作名称..." oninput="filterExercises()">
</div>

<div class="filter-row" id="filter-bodypart"></div>
<div class="filter-row" id="filter-equipment"></div>

<div class="count-bar">
  <span id="count-label">加载中...</span>
  <span id="plan-badge" style="background:var(--green-light);color:#2e7d32;padding:2px 10px;border-radius:10px;font-weight:600"></span>
</div>

<div class="container" id="ex-list">
  <div class="loading"><div class="spinner"></div>正在加载 1324 个动作数据...</div>
</div>

<div class="detail-overlay" id="detail-overlay" onclick="closeDetail()">
  <div class="detail-card" onclick="event.stopPropagation()">
    <div class="detail-header">
      <span class="detail-title" id="detail-title"></span>
      <button class="detail-close" onclick="closeDetail()">&times;</button>
    </div>
    <div class="detail-body" id="detail-body"></div>
  </div>
</div>

<div class="footer">
  数据来源：<a href="https://github.com/Mrzzchao/exercises-dataset" target="_blank">Mrzzchao/exercises-dataset</a> · 1324 个动作
</div>

<script src="exercises/exercise-map.js"></script>
<script>
let exercises = [];
let filtered = [];
let activeBodyPart = '';
let activeEquipment = '';
let searchQuery = '';

// Load dataset
async function loadExercises() {
  try {
    const res = await fetch('exercises/exercises-dataset.json');
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    exercises = data;
    buildFilters();
    filterExercises();
    document.getElementById('hdr-sub').textContent = '共 ' + exercises.length + ' 个动作';
  } catch (e) {
    document.getElementById('ex-list').innerHTML =
      '<div class="empty-state">⚠️ 动作数据加载失败，请检查网络后刷新重试</div>';
    document.getElementById('hdr-sub').textContent = '加载失败';
  }
}

// Collect unique values
function getUnique(arr, field) {
  const vals = new Set();
  arr.forEach(e => vals.add(e[field]));
  return Array.from(vals).sort();
}

// Build filter chips
function buildFilters() {
  const bodyParts = getUnique(exercises, 'body_part');
  const equipments = getUnique(exercises, 'equipment');

  // Body part filters
  const bpContainer = document.getElementById('filter-bodypart');
  bpContainer.innerHTML = '<button class="filter-chip active" onclick="setFilter(\'bodypart\',\'\')">全部</button>' +
    bodyParts.map(bp =>
      `<button class="filter-chip" onclick="setFilter('bodypart','${bp}')">${BODYPART_ZH[bp] || bp}</button>`
    ).join('');

  // Equipment filters
  const eqContainer = document.getElementById('filter-equipment');
  eqContainer.innerHTML = '<button class="filter-chip active" onclick="setFilter(\'equipment\',\'\')">全部器材</button>' +
    equipments.map(eq =>
      `<button class="filter-chip" onclick="setFilter('equipment','${eq}')">${EQUIP_ZH[eq] || eq}</button>`
    ).join('');
}

// Set filter
function setFilter(type, value) {
  if (type === 'bodypart') {
    activeBodyPart = value;
    document.querySelectorAll('#filter-bodypart .filter-chip').forEach(el => {
      el.classList.toggle('active', el.textContent === (value ? BODYPART_ZH[value] || value : '全部'));
    });
  } else {
    activeEquipment = value;
    document.querySelectorAll('#filter-equipment .filter-chip').forEach(el => {
      el.classList.toggle('active', el.textContent === (value ? EQUIP_ZH[value] || value : '全部器材'));
    });
  }
  filterExercises();
}

// Search input
document.getElementById('search-input').addEventListener('input', function() {
  searchQuery = this.value.toLowerCase();
  filterExercises();
});

// Filter + search
function filterExercises() {
  filtered = exercises.filter(e => {
    if (activeBodyPart && e.body_part !== activeBodyPart) return false;
    if (activeEquipment && e.equipment !== activeEquipment) return false;
    if (searchQuery) {
      const name = e.name.toLowerCase();
      const zh = e.instructions.zh || '';
      const zhName = (e.name_zh || '').toLowerCase();
      return name.includes(searchQuery) || zh.includes(searchQuery) || zhName.includes(searchQuery);
    }
    return true;
  });
  renderList();
}

// Render exercise list
function renderList() {
  const container = document.getElementById('ex-list');
  const countLabel = document.getElementById('count-label');

  if (filtered.length === 0) {
    container.innerHTML = '<div class="empty-state">😕 没有找到匹配的动作</div>';
    countLabel.textContent = '0 个动作';
    document.getElementById('plan-badge').textContent = '';
    return;
  }

  countLabel.textContent = filtered.length + ' / ' + exercises.length + ' 个动作';

  const planCount = filtered.filter(e => ENGLISH_TO_ZH[e.name.toLowerCase()]).length;
  document.getElementById('plan-badge').textContent = planCount > 0 ? '🏋️ 含 ' + planCount + ' 个计划动作' : '';

  container.innerHTML = filtered.map((e, i) => {
    const zhName = e.name_zh || ENGLISH_TO_ZH[e.name.toLowerCase()];
    const name = zhName || e.name;
    const style = `animation-delay:${(i % 20) * 0.04}s`;
    const catZH = CAT_ZH[e.category] || e.category;
    const bodyZH = BODYPART_ZH[e.body_part] || e.body_part;
    const equipZH = EQUIP_ZH[e.equipment] || e.equipment;
    const isPlan = !!ENGLISH_TO_ZH[e.name.toLowerCase()];
    const gifUrl = e.media_id ? `https://static.exercisedb.dev/media/${e.media_id}.gif` : '';
    const gifThumb = gifUrl ? `<img class="ex-thumb" src="${gifUrl}" alt="${name}" loading="lazy" onclick="event.stopPropagation();showDetail('${e.id}')">` : '';

    return `<div class="ex-item" style="${style}" onclick="showDetail('${e.id}')">
      <div class="ex-header">
        <div class="ex-header-left">
          ${gifThumb}
          <div>
            <div class="ex-name">${name}</div>
            ${zhName && e.name.toLowerCase() !== zhName.toLowerCase() ? `<div class="ex-name-en">${e.name}</div>` : ''}
            <div class="ex-tags">
              <span class="ex-tag tag-bodypart">${bodyZH}</span>
              <span class="ex-tag tag-category">${catZH}</span>
              <span class="ex-tag tag-equipment">${equipZH}</span>
              ${isPlan ? '<span class="ex-tag tag-plan">📋 计划</span>' : ''}
            </div>
          </div>
        </div>
      </div>
    </div>`;
  }).join('');
}

// Show detail
function showDetail(id) {
  const e = exercises.find(x => x.id === id);
  if (!e) return;

  const zhName = e.name_zh || ENGLISH_TO_ZH[e.name.toLowerCase()];
  const name = zhName || e.name;
  const instructions = e.instructions.zh || e.instructions.en || '暂无说明';
  const steps = e.instruction_steps?.zh || e.instruction_steps?.en || null;
  const isPlan = !!ENGLISH_TO_ZH[e.name.toLowerCase()];
  const gifUrl = e.media_id ? `https://static.exercisedb.dev/media/${e.media_id}.gif` : '';

  document.getElementById('detail-title').textContent = name;

  let bodyHTML = '';

  // GIF image
  if (gifUrl) {
    bodyHTML += `<img class="detail-media" src="${gifUrl}" alt="${name}" loading="lazy">`;
  }

  // English name subtitle
  if (zhName && e.name.toLowerCase() !== zhName.toLowerCase()) {
    bodyHTML += `<div style="font-size:0.82rem;color:var(--text-secondary);margin-bottom:12px"><em>${e.name}</em></div>`;
  }

  bodyHTML += `
    <div class="detail-info">
      <div class="detail-info-item">
        <span class="detail-info-label">部位</span>
        <span class="detail-info-value">${BODYPART_ZH[e.body_part] || e.body_part}</span>
      </div>
      <div class="detail-info-item">
        <span class="detail-info-label">类别</span>
        <span class="detail-info-value">${CAT_ZH[e.category] || e.category}</span>
      </div>
      <div class="detail-info-item">
        <span class="detail-info-label">器材</span>
        <span class="detail-info-value">${EQUIP_ZH[e.equipment] || e.equipment}</span>
      </div>
    </div>
    <div class="detail-section-title">📝 动作要领</div>
    <div class="detail-instruction">${instructions}</div>
  `;

  if (steps) {
    bodyHTML += `<div class="detail-section-title" style="margin-top:14px">📋 分步指南</div>
    <ol style="font-size:0.85rem;color:#4a5568;line-height:1.7;padding-left:20px">
      ${steps.map(s => `<li style="margin-bottom:4px">${s}</li>`).join('')}
    </ol>`;
  }

  if (isPlan) {
    bodyHTML += `<a class="detail-plan-link" href="index.html">📋 此动作在增重计划中</a>`;
  } else {
    bodyHTML += `<div class="detail-not-in-plan">未在当前计划中</div>`;
  }

  document.getElementById('detail-body').innerHTML = bodyHTML;
  document.getElementById('detail-overlay').classList.add('show');
  document.body.style.overflow = 'hidden';
}

function closeDetail() {
  document.getElementById('detail-overlay').classList.remove('show');
  document.body.style.overflow = '';
}

// Keyboard shortcut
document.addEventListener('keydown', function(e) {
  if (e.key === 'Escape') closeDetail();
  if (e.key === '/' && !e.ctrlKey && !e.metaKey) {
    const input = document.getElementById('search-input');
    if (document.activeElement !== input) {
      e.preventDefault();
      input.focus();
    }
  }
});

// Handle URL search parameter (e.g., ?search=杠铃卧推)
function handleUrlSearch() {
  const params = new URLSearchParams(window.location.search);
  const q = params.get('search');
  if (q) {
    document.getElementById('search-input').value = q;
    searchQuery = q.toLowerCase();
    // Will be applied after loadExercises completes
  }
}

// Start
loadExercises().then(() => handleUrlSearch());
handleUrlSearch();
</script>
</body>
</html>
